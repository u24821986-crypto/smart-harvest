<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Operations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
    <header class="bg-success text-white py-4 shadow">
        <div class="container d-flex flex-column flex-sm-row align-items-center justify-content-between gap-3">
            <div>
                <p class="small text-warning text-uppercase fw-bold mb-1">Farm operations</p>
                <h1 class="mb-1">Smart Operations</h1>
                <p class="mb-0">Record daily production performance across the farm.</p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <img src="images/logo.jpg" alt="Rembander Logo" width="88" height="68" class="rounded bg-white p-1 object-fit-contain">
                <a href="dashboard.html" class="btn btn-warning fw-bold">Dashboard</a>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <section class="mb-5" aria-labelledby="operations-heading">
            <p class="small text-success text-uppercase fw-bold mb-1">Daily production</p>
            <h2 class="mb-3" id="operations-heading">Operations Management</h2>

            <div class="row g-4">
                <article class="col-md-6">
                    <div class="card h-100 border-top border-4 border-warning shadow-sm">
                        <div class="card-body">
                            <h3 class="h5">Team Information</h3>
                            <form action="/Team-Leader" method="post">
                                <div class="mb-3">
                                    <label for="production" class="form-label">Shift period</label>
                                    <select id="production" name="operationBlock" class="form-select" required>
                                        <option value="Clockin">Clock In</option>
                                        <option value="Clockout">Clock Out</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="teamInfo" class="form-label">Team Leader<span class="small text-secondary">(required)</span></label>
                                    <input type="text" id="teamInfo" name="teamInfo" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="productionBlock" class="form-label">Operation Location</label>
                                    <select id="productionBlock" name="operationBlock" class="form-select" required>
                                        <option value="Block1">Block 1</option>
                                        <option value="Block2">Block 2</option>
                                        <option value="Block3">Block 3</option>
                                        <option value="Block4">Block 4</option>
                                        <option value="Block5">Block 5</option>
                                        <option value="Block6">Block 6</option>
                                        <option value="Block7">Block 7</option>
                                    </select>
                                </div>


                                <div class="mb-3">
                                    <label for="NumOfWorkers" class="form-label">Number of Workers<span class="small text-secondary">(required)</span></label>
                                    <input type="number" id="NumOfWorkers" name="NumOfWorkers" class="form-control" min="0">
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-6">
                                        <label for="DateTeam" class="form-label">Date</label>
                                        <input type="date" id="DateTeam" name="DateHarvested" class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label for="TimeTeam" class="form-label">Time</label>
                                        <input type="time" id="TimeTeam" name="TimeHarvested" class="form-control">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Submit Team Information</button>
                            </form>
                        </div>
                    </div>
                </article>

                <article class="col-md-6">
                    <div class="card h-100 border-top border-4 border-warning shadow-sm">
                        <div class="card-body">
                            <h3 class="h5">Harvested Crates</h3>
                            <form action="/Harvesting" method="post">
                                <div class="mb-3">
                                    <label for="Team" class="form-label">Team Leader<span class="small text-secondary">(required)</span></label>
                                    <input type="number" id="Team" name="Team" class="form-control" min="0" required>
                                </div>
                                <div class="mb-3">
                                    <label for="CratesHarvested" class="form-label">Crates Harvested<span class="small text-secondary">(required)</span></label>
                                    <input type="number" id="CratesHarvested" name="CratesHarvested" class="form-control" min="0" required>
                                </div>
                                <div class="mb-3">
                                    <label for="NumOfTrees" class="form-label">Number of Trees</label>
                                    <input type="number" id="NumOfTrees" name="NumOfTrees" class="form-control" min="0" required>
                                </div>
                                <div class="mb-3">
                                    <label for="RejectedCrates" class="form-label">Rejected Crates<span class="small text-secondary">(required)</span></label>
                                    <input type="number" id="RejectedCrates" name="RejectedCrates" class="form-control" min="0" required>
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-6">
                                        <label for="DateHarvested" class="form-label">Date</label>
                                        <input type="date" id="DateHarvested" name="DateHarvested" class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label for="TimeHarvested" class="form-label">Time</label>
                                        <input type="time" id="TimeHarvested" name="TimeHarvested" class="form-control">
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-success w-100">Submit Harvesting Details</button>
                            </form>
                        </div>
                    </div>
                </article>
            </div>
        </section>

        <section class="mb-5" aria-labelledby="logistics-heading">
            <p class="small text-success text-uppercase fw-bold mb-1">Transport and delivery</p>
            <h2 class="mb-3" id="logistics-heading">Logistics Management</h2>

            <article class="card border-top border-4 border-warning shadow-sm">
                <div class="card-body">
                    <form action="/Logistics" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="tripNumber" class="form-label">Trip Number<span class="small text-secondary">(required)</span></label>
                                <input type="number" id="tripNumber" name="tripNumber" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label for="vehicleType" class="form-label">Vehicle Type</label>
                                <select id="vehicleType" name="vehicleType" class="form-select" required>
                                    <option value="Truck">Truck</option>
                                    <option value="Tractor">Tractor</option>
                                    <option value="Bakkie">Bakkie</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="vehicleInfo" class="form-label">Vehicle Registration Number<span class="small text-secondary">(required)</span></label>
                                <input type="text" id="vehicleInfo" name="vehicleInfo" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="driverInfo" class="form-label">Driver Name<span class="small text-secondary">(required)</span></label>
                                <input type="text" id="driverInfo" name="driverInfo" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="destination" class="form-label">Destination</label>
                                <select id="destination" name="destination" class="form-select" required>
                                    <option value="PackHouse">Pack house</option>
                                    <option value="FarmShed">Farm shed</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="numCrates" class="form-label">Number of Crates Initially Loaded</label>
                                <input type="number" id="numCrates" name="numCrates" class="form-control" min="0" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                                <label for="numCratesDest" class="form-label">Number of Crates at Destination</label>
                                <input type="number" id="numCratesDest" name="numCratesDest" class="form-control" min="0" required>
                            </div>

                        <div class="row g-3 mt-1">
                            <div class="col-6">
                                <label for="DateTransport" class="form-label">Date</label>
                                <input type="date" id="DateTransport" name="DateHarvested" class="form-control">
                            </div>
                            <div class="col-6">
                                <label for="time" class="form-label">Truck/Bakkie Departure Time(optional)</label>
                                <input type="time" id="time" name="time" class="form-control">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success mt-3">Submit Logistics</button>
                    </form>
                </div>
            </article>
        </section>

        <section class="mb-5" aria-labelledby="notes-heading">
            <p class="small text-success text-uppercase fw-bold mb-1">Daily record</p>
            <h2 class="mb-1" id="notes-heading">Operational Notes</h2>
            <p class="text-secondary mb-3">Share delays or any additional information.</p>

            <article class="card border-top border-4 border-warning shadow-sm">
                <div class="card-body">
                    <form action="/Summary" method="post">
                        <div class="mb-3">
                                    <label for="endShiftCrates" class="form-label">End shift Crates <span class="small text-secondary">(required)</span></label>
                                    <input type="number" id="endShiftCrates" name="endShiftCrates" class="form-control" min="0">
                                </div>
                        <div class="mb-3">
                            <label for="delaysInfo" class="form-label">Delays</label>
                            <input type="text" id="delaysInfo" name="delaysInfo" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="remarksInfo" class="form-label">Additional Remarks</label>
                            <input type="text" id="remarksInfo" name="remarksInfo" class="form-control">
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label for="DateNotes" class="form-label">Date</label>
                                <input type="date" id="DateNotes" name="DateHarvested" class="form-control">
                            </div>
                            <div class="col-6">
                                <label for="TimeNotes" class="form-label">Time</label>
                                <input type="time" id="TimeNotes" name="TimeHarvested" class="form-control">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">Submit Notes</button>
                    </form>
                </div>
            </article>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <script>
        
        const today = new Date();
        const todayString = [
            today.getFullYear(),
            String(today.getMonth() + 1).padStart(2, "0"),
            String(today.getDate()).padStart(2, "0")
        ].join("-");
        const currentTime = [
            String(today.getHours()).padStart(2, "0"),
            String(today.getMinutes()).padStart(2, "0")
        ].join(":");

        document.querySelectorAll('input[type="time"]').forEach((input) => {
            input.value = currentTime;
        });

         const datetransport = document.getElementById("DateTransport");
        datetransport.value = todayString;

        const dateHarvested = document.getElementById("DateHarvested");
        dateHarvested.value = todayString;

         const dateTeam = document.getElementById("DateTeam");
        dateTeam.value = todayString;
        

         const dateNotes = document.getElementById("DateNotes");
        dateNotes.value = todayString;
        
    </script>
</body>
</html>
