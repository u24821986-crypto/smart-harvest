<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rembander Agribusiness</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Light grey background from your palette */
        body {
            background-color: #F4F5F4;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Rembander Brand Colors */
        .text-brand-dark { color: #235C06 !important; }
        .btn-brand-yellow { 
            background-color: #FFD006; 
            color: #000000; 
            font-weight: 700;
            border: none;
        }
        .btn-brand-yellow:hover {
            background-color: #ADB001; /* Lime olive on hover */
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                
                <!-- Login Card -->
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        
                        <!-- Title -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-brand-dark">SmartHarvest</h2>
                            <p class="text-muted">Rembander Agribusiness</p>
                        </div>

                        <!-- The Form (Action points to dashboard.html) -->
                        <form action="dashboard.html">
                            
                            <!-- Username Input -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control form-control-lg" placeholder="Enter your username" required>
                            </div>

                            <!-- Password Input -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-lg" placeholder="Enter password" required>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-brand-yellow btn-lg py-3">Log In</button>
                            </div>
                        </form>

                        <!-- Back to Home Link -->
                        <div class="text-center mt-4">
                            <a href="index.html" class="text-decoration-none text-muted">← Back to Home</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
